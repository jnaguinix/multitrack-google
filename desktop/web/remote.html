<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Conexión remota</title>
  <link rel="stylesheet" href="/remote.css">
  <script defer src="/remote.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="2" y="9" width="2.6" height="6" rx="1.3"/><rect x="6.6" y="5" width="2.6" height="14" rx="1.3"/>
        <rect x="11.2" y="2" width="2.6" height="20" rx="1.3"/><rect x="15.8" y="6" width="2.6" height="12" rx="1.3"/>
        <rect x="20.4" y="10" width="2.6" height="4" rx="1.3"/>
      </svg>
      <span class="wordmark">OmniTracks</span>
      <h1 id="title" class="role-pill">Conexión remota</h1>
    </div>
    <span id="link" class="link" data-state="off" role="status" aria-label="Sin conexión"><i></i><b id="link-text">Sin conexión</b></span>
  </header>
  <main data-ui>
    <p id="connection" role="status">Conectando…</p>
    <div class="layout">
      <div class="stage">
        <div class="dock">
          <section aria-labelledby="song" id="performance" hidden>
            <div class="now-playing">
              <span id="play-state" role="img" aria-label="Sin canción">■</span>
              <div class="song-head">
                <h2 id="song">Sin canción</h2>
                <p id="details"></p>
              </div>
              <p id="time">00:00 / 00:00</p>
            </div>
            <progress id="progress" aria-label="Progreso de la canción" value="0" max="1"></progress>
          </section>
          <section id="map-wrap" aria-label="Mapa de secciones" hidden>
            <ol id="map"></ol>
            <p id="map-label"></p>
          </section>
        </div>
        <section id="monitor" aria-label="Tiempo restante y secciones" hidden>
          <div class="countdown">
            <p id="remaining-label">Tiempo restante</p>
            <p id="remaining" role="timer" aria-labelledby="remaining-label">--:--</p>
            <progress id="remaining-progress" aria-label="Proporción restante" value="0" max="1"></progress>
            <p id="duration">Duración total --:--</p>
          </div>
          <dl id="cues">
            <div class="cue-current"><dt>Sección actual</dt><dd id="section">—</dd><dd id="section-left" class="cue-left"></dd></div>
            <div class="cue-next"><dt>Próxima sección</dt><dd id="next-section">—</dd></div>
            <div class="next-song"><dt>Próxima canción</dt><dd id="next-song">—</dd></div>
            <div id="live-beat" hidden><dt>Compás y pulso</dt><dd id="bar">—</dd></div>
            <div class="scheduled-jump" hidden><dt>Salto programado</dt><dd id="jump">—</dd></div>
          </dl>
        </section>
        <section id="mix" aria-labelledby="mix-title" hidden>
          <h2 id="mix-title">Pistas</h2>
          <p id="notice" role="status"></p>
          <div id="tracks"></div>
        </section>
      </div>
      <details id="queue" open hidden>
        <summary><h2 id="queue-title">Setlist</h2></summary>
        <ol id="songs"></ol>
      </details>
    </div>
  </main>
</body>
</html>
